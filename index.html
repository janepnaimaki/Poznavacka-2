<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poznávačka – výtrusné a cévnaté rostliny</title>
<style>
:root{--bg:#f6f7f2;--card:#fff;--tx:#1d2a1f;--mu:#667568;--ac:#2f7d4a;--ok:#2f7d4a;--no:#c0452f;--bd:#dbe1d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1e271f;--tx:#e8efe6;--mu:#97a69a;--ac:#6fcf8e;--ok:#6fcf8e;--no:#ef7f68;--bd:#2f3b31}}
:root[data-theme="dark"]{--bg:#141a15;--card:#1e271f;--tx:#e8efe6;--mu:#97a69a;--ac:#6fcf8e;--ok:#6fcf8e;--no:#ef7f68;--bd:#2f3b31}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}.sub{color:var(--mu);font-size:.85rem;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px 16px;text-align:center;margin:12px 0}
.num{color:var(--mu);font-size:.9rem}.name{font-size:1.7rem;font-weight:700;margin:10px 0;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.grp{font-size:.8rem;color:var(--mu)}.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.ok{border-color:var(--ok);color:var(--ok)}.no{border-color:var(--no);color:var(--no)}
ul{list-style:none;padding:0;margin:0}li{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--bd)}
li .n{width:2.2em;color:var(--mu);text-align:right}li .t{flex:1}li a{color:var(--ac);font-size:.85rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bd)}.dot.k{background:var(--ok)}
.hide{display:none}img{max-width:100%;max-height:48vh;border-radius:12px;object-fit:contain}
</style></head><body><main>
<h1>🌿 Poznávačka: výtrusné a cévnaté rostliny</h1>
<div class="sub">Vyšší gymnázium · 130 druhů · <span id="stat"></span></div>
<div class="row" id="modes"></div>
<div class="row" id="groups"></div>
<div class="bar"><i id="pb"></i></div>
<section id="v-cards"></section><section id="v-test" class="hide"></section><section id="v-list" class="hide"></section>
</main>
<script>
const G=[["Mechorosty","bělomech sivý|měřík|ploník|porostnice mnohotvárná|rašeliník"],
["Kapraďorosty","hasivka orličí|kapraď samec|osladič|papratka samičí|plavuň vidlačka|přeslička lesní|přeslička rolní"],
["Nahosemenné","blahočet (araukárie)|borovice kleč (kosodřevina)|borovice lesní|borovice pinie|cykas indický|jalovec|jedle bělokorá|jinan|modřín opadavý|smrk pichlavý|smrk ztepilý|tis červený|zerav západní (túje)"],
["Krytosemenné","bazalka|blatouch|bledule|bodlák|bolševník velkolepý|brokolice|broskvoň|bříza|buk lesní|celer|cibule kuchyňská|cukrová třtina (cukrovník)|česnek|čočka|datlovník|divizna|dub letní|dub zimní|fazol|habr|heřmánek|hluchavka bílá|hluchavka nachová|hluchavka žlutá (pitulník)|hořčice bílá|hrách|hrušeň|huseníček|chrpa|jabloň|jahodník|ječmen|jeřáb|jetel luční|jírovec maďal|jitrocel kopinatý|kapusta|kedluben|kmín|kokosovník|kokoška pastuší tobolka|kopr|kopretina|kosatec bahenní|křen|kukuřice|květák|leknín bílý|libeček|lilek brambor|lilie zlatohlávek|lípa|lipnice|líska|locika salát|mák vlčí|máta|mateřídouška|meruňka|mochna|mrkev|náprstník|narcis|olše|oves|pampeliška|paprika roční|penízek rolní|petržel|plicník|podběl|podzemnice olejná|pomněnka|pryskyřník|psárka|pšenice|rajče jedlé|rákos|rozrazil|růže|rýže|řebříček|ředkvička|řepka olejka|sasanka|sedmikráska|sítina|slunečnice roční|sněženka|sója|srha|šafrán (krokus)|šácholan (magnolie)|šalvěj lékařská|tabák|topol|trnovník akát|třešeň|tulipán|vavřín|vlaštovičník větší|vrba|vstavač|zelí|žito"]];
const P=[];G.forEach(([g,s],gi)=>s.split("|").forEach(n=>P.push({n:P.length+1,name:n,g:gi})));
let K={};try{K=JSON.parse(localStorage.getItem("pz")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("pz",JSON.stringify(K))}catch(e){}};
let IMG={};
const EX=["jpg","png","jpeg","webp","gif","svg"];
function nx(el){const k=+el.dataset.i+1;if(k>=EX.length){el.style.display="none";return}el.dataset.i=k;el.src="obrazky/"+String(el.dataset.n).padStart(3,"0")+"."+EX[k]}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("pz",1);r.onupgradeneeded=()=>r.result.createObjectStore("s");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(v){try{const d=await idb();d.transaction("s","readwrite").objectStore("s").put(v,"imgs")}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction("s").objectStore("s").get("imgs");q.onsuccess=()=>res(q.result||{});q.onerror=()=>res({})})}catch(e){return {}}}
let mode="cards",grp=-1,only=false,i=0,rev=false,order=[];
const $=id=>document.getElementById(id);
const img=p=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent(p.name.replace(/\(|\)/g,"")+" rostlina");
const pool=()=>P.filter(p=>(grp<0||p.g===grp)&&(!only||!K[p.n]));
function build(){order=pool();if(mode!=="list")order=order.slice().sort(()=>Math.random()-.5);i=0;rev=false;render()}
function mark(v){const p=order[i];K[p.n]=v;save();i++;rev=false;render()}
function render(){
 $("modes").innerHTML=[["cards","Procvičování"],["list","Seznam"]].map(([m,t])=>`<button class="${mode===m?"on":""}" data-m="${m}">${t}</button>`).join("")+`<button class="${only?"on":""}" data-o="1">Jen neumím</button>`;
 $("groups").innerHTML=[["-1","Vše"],...G.map((g,x)=>[x,g[0]])].map(([v,t])=>`<button class="${grp==v?"on":""}" data-g="${v}">${t}</button>`).join("");
 const kn=P.filter(p=>K[p.n]).length;$("stat").textContent=`umím ${kn} / ${P.length}`;$("pb").style.width=kn/P.length*100+"%";
 ["cards","test","list"].forEach(m=>$("v-"+m).classList.toggle("hide",m!==mode));
 if(mode==="list"){$("v-list").innerHTML="<ul>"+order.map(p=>`<li><span class="n">${p.n}</span><span class="dot ${K[p.n]?"k":""}"></span><span class="t">${p.name}</span><a href="${img(p)}" target="_blank" rel="noopener">obrázky ↗</a></li>`).join("")+"</ul>";return}
 const el=$("v-"+mode);
 if(i>=order.length){el.innerHTML=`<div class="card"><div class="name">${order.length?"Hotovo 🎉":"Nic k procvičení"}</div><button data-r="1">Znovu</button></div>`;return}
 const p=order[i],t=true,show=!t||rev;
 el.innerHTML=`<div class="card"><div class="num">č. ${p.n} · ${i+1}/${order.length}</div><img src="obrazky/${String(p.n).padStart(3,"0")}.jpg" data-n="${p.n}" data-i="0" onerror="nx(this)" alt=""><div class="name">${show?p.name:"?"}</div><div class="grp">${G[p.g][0]}</div>
 <div class="row" style="justify-content:center;margin-top:12px"><a class="btn on" style="background:var(--ac);color:#fff" href="${img(p)}" target="_blank" rel="noopener">🔍 Zobrazit obrázky</a>${t&&!rev?'<button data-s="1">Ukázat název</button>':""}</div></div>
 ${show?'<div class="row"><button class="no" data-k="0" style="flex:1">Neumím</button><button class="ok" data-k="1" style="flex:1">Umím</button></div>':""}`;
}
document.addEventListener("click",e=>{const d=e.target.closest("button");if(!d)return;
 if(d.dataset.m){mode=d.dataset.m;build()}else if(d.dataset.g){grp=+d.dataset.g;build()}else if(d.dataset.o){only=!only;build()}
 else if(d.dataset.s){rev=true;render()}else if(d.dataset.k){mark(d.dataset.k==="1")}else if(d.dataset.r)build()});
document.addEventListener("change",async e=>{if(e.target.id!=="fi")return;
 for(const f of e.target.files){const m=f.name.match(/^(\d+)/);if(!m)continue;
  IMG[+m[1]]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
 idbSet(IMG);render()});
build();
</script></body></html>
