<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poznávačka – výtrusné a cévnaté rostliny</title>
<style>
:root{--bg:#f6f7f2;--card:#fff;--tx:#1d2a1f;--mu:#667568;--ac:#2f7d4a;--ok:#2f7d4a;--no:#c0452f;--bd:#dbe1d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1e271f;--tx:#e8efe6;--mu:#97a69a;--ac:#6fcf8e;--ok:#6fcf8e;--no:#ef7f68;--bd:#2f3b31}}
:root[data-theme="dark"]{--bg:#141a15;--card:#1e271f;--tx:#e8efe6;--mu:#97a69a;--ac:#6fcf8e;--ok:#6fcf8e;--no:#ef7f68;--bd:#2f3b31}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}.sub{color:var(--mu);font-size:.85rem;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px 16px;text-align:center;margin:12px 0}
.num{color:var(--mu);font-size:.9rem}.name{font-size:1.7rem;font-weight:700;margin:10px 0;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.grp{font-size:.8rem;color:var(--mu)}.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.ok{border-color:var(--ok);color:var(--ok)}.no{border-color:var(--no);color:var(--no)}
ul{list-style:none;padding:0;margin:0}li{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--bd)}
li .n{width:2.2em;color:var(--mu);text-align:right}li .t{flex:1}li a{color:var(--ac);font-size:.85rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bd)}.dot.k{background:var(--ok)}
.hide{display:none}main{padding-bottom:96px}
#mb{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 6px 24px #0004;overflow:hidden;display:none;cursor:pointer;max-width:640px;margin:0 auto}
#mbp{display:block;height:2px;background:var(--ac);width:0}#mb .mbi{display:flex;align-items:center;gap:6px;padding:8px 10px}
.mbt{flex:1;min-width:0}.mbt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}.mbt small{color:var(--mu)}
#mb button{border:0;background:none;font-size:1.15rem;padding:6px 8px}#mb .pp{background:var(--ac);color:#fff;border-radius:50%;width:40px;height:40px;padding:0}
.mbcv,.th{border-radius:8px;object-fit:cover;flex:none;max-height:none}.mbcv{width:44px;height:44px}.th{width:40px;height:40px;border-radius:6px}
.ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--ac),var(--bd));color:#fff;font-size:1.3rem}
#sh{position:fixed;inset:0;z-index:8;background:var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility .3s;overflow-y:auto}#sh.open{transform:none;visibility:visible}
#shbg{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;border-radius:0;filter:blur(60px) saturate(1.3);opacity:.35;display:none;pointer-events:none}
.shi{position:relative;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mu);font-size:.85rem}.shh button{border:0;background:none;font-size:1.5rem;padding:0 6px}
.shcv{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;box-shadow:0 12px 40px #0006;max-height:none;font-size:5rem}
.sht{margin:18px 0 6px;font-size:1.3rem}#sk{width:100%;accent-color:var(--ac)}.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:.8rem}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px}.ctl button{border:0;background:none;font-size:1.4rem;padding:8px}.ctl .big{width:64px;height:64px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:1.6rem;padding:0}.ctl .act{color:var(--ac)}
#tl button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;flex:1;padding:6px 2px;color:inherit}#tl button.cur{color:var(--ac);font-weight:600}
#mp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:10px}#mp summary{cursor:pointer}#tl li{padding:0;border:0}#cv{width:100%;max-width:260px;aspect-ratio:1;object-fit:cover;border-radius:12px;margin:10px auto 0}#tl .th{width:36px;height:36px;border-radius:6px;object-fit:cover;max-height:none}#tl button{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;flex:1;padding:6px 2px;color:inherit}#tl button.cur{color:var(--ac);font-weight:600}#cd{position:relative}.flag{position:absolute;top:8px;right:8px;padding:4px 10px}#rp{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#rp>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:420px}#rp textarea{width:100%;min-height:90px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:6px}#cd{touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .15s,border-color .15s;cursor:grab}img{-webkit-user-drag:none}
h2{font-size:1rem;margin:18px 0 4px}h2.ok{color:var(--ok)}h2.no{color:var(--no)}li button{padding:4px 9px}li button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}li button.on.no{background:var(--no);border-color:var(--no);color:#fff}img{max-width:100%;max-height:48vh;border-radius:12px;object-fit:contain}
</style></head><body><main>
<h1>🌿 Poznávačka: výtrusné a cévnaté rostliny</h1>
<div class="sub">Vyšší gymnázium · 130 druhů · <span id="stat"></span></div>
<audio id="au" preload="none"></audio>
<div id="mb"><i id="mbp"></i><div class="mbi"><span id="mbc"></span><div class="mbt"><b id="mbn">Hudba</b><small id="mbs"></small></div><button data-pa="prev">⏮</button><button class="pp" id="mbb" data-pa="toggle">▶</button><button data-pa="next">⏭</button></div></div>
<div id="sh"><img id="shbg" alt=""><div class="shi"><div class="shh"><button data-pa="close" aria-label="Zavřít">⌄</button><span>Přehrává se</span><span style="width:32px"></span></div>
<div id="shc"></div><div class="sht"><b id="shn">Hudba</b></div><input type="range" id="sk" min="0" max="1000" value="0"><div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div>
<div class="ctl"><button data-pa="shuf" id="bsh">🔀</button><button data-pa="prev">⏮</button><button class="big" id="bpp" data-pa="toggle">▶</button><button data-pa="next">⏭</button><button data-pa="rep" id="brp">🔁</button></div>
<h2>Playlist</h2><ul id="tl"></ul></div></div>
<div class="row" id="modes"></div>
<div class="row" id="groups"></div>
<div class="bar"><i id="pb"></i></div>
<section id="v-cards"></section><section id="v-test" class="hide"></section><section id="v-list" class="hide"></section>
</main>
<script>
const G=[["Mechorosty","bělomech sivý|měřík|ploník|porostnice mnohotvárná|rašeliník"],
["Kapraďorosty","hasivka orličí|kapraď samec|osladič|papratka samičí|plavuň vidlačka|přeslička lesní|přeslička rolní"],
["Nahosemenné","blahočet (araukárie)|borovice kleč (kosodřevina)|borovice lesní|borovice pinie|cykas indický|jalovec|jedle bělokorá|jinan|modřín opadavý|smrk pichlavý|smrk ztepilý|tis červený|zerav západní (túje)"],
["Krytosemenné","bazalka|blatouch|bledule|bodlák|bolševník velkolepý|brokolice|broskvoň|bříza|buk lesní|celer|cibule kuchyňská|cukrová třtina (cukrovník)|česnek|čočka|datlovník|divizna|dub letní|dub zimní|fazol|habr|heřmánek|hluchavka bílá|hluchavka nachová|hluchavka žlutá (pitulník)|hořčice bílá|hrách|hrušeň|huseníček|chrpa|jabloň|jahodník|ječmen|jeřáb|jetel luční|jírovec maďal|jitrocel kopinatý|kapusta|kedluben|kmín|kokosovník|kokoška pastuší tobolka|kopr|kopretina|kosatec bahenní|křen|kukuřice|květák|leknín bílý|libeček|lilek brambor|lilie zlatohlávek|lípa|lipnice|líska|locika salát|mák vlčí|máta|mateřídouška|meruňka|mochna|mrkev|náprstník|narcis|olše|oves|pampeliška|paprika roční|penízek rolní|petržel|plicník|podběl|podzemnice olejná|pomněnka|pryskyřník|psárka|pšenice|rajče jedlé|rákos|rozrazil|růže|rýže|řebříček|ředkvička|řepka olejka|sasanka|sedmikráska|sítina|slunečnice roční|sněženka|sója|srha|šafrán (krokus)|šácholan (magnolie)|šalvěj lékařská|tabák|topol|trnovník akát|třešeň|tulipán|vavřín|vlaštovičník větší|vrba|vstavač|zelí|žito"]];
const P=[];G.forEach(([g,s],gi)=>s.split("|").forEach(n=>P.push({n:P.length+1,name:n,g:gi})));
let K={};try{K=JSON.parse(localStorage.getItem("pz")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("pz",JSON.stringify(K))}catch(e){}};
let IMG={};
const EX=["jpg","png","jpeg","webp","gif","svg","JPG","PNG","JPEG","jpe","jfif","avif","bmp"];
const FORM={url:"https://api.web3forms.com/submit",key:"bad16937-cef9-4a17-bf17-ccc305746e7a"}; // <-- sem vlož adresu formuláře (viz návod)
let FILES={};
try{FILES=JSON.parse(localStorage.getItem("pzf")||"{}")}catch(e){}
async function loadFiles(){try{
 const h=location.hostname.split(".")[0],r=location.pathname.split("/")[1];
 if(!location.hostname.endsWith("github.io")||!r)return;
 const j=await(await fetch(`https://api.github.com/repos/${h}/${r}/contents/obrazky`)).json();
 if(!Array.isArray(j))return;const f={};
 j.forEach(x=>{const m=x.name.match(/^(\d+)/);if(m)f[+m[1]]=x.name});
 FILES=f;try{localStorage.setItem("pzf",JSON.stringify(f))}catch(e){}render()}catch(e){}}
function nx(el){const k=+el.dataset.i+1;if(k>=EX.length){el.style.display="none";return}el.dataset.i=k;el.src="obrazky/"+String(el.dataset.n).padStart(3,"0")+"."+EX[k]}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("pz",1);r.onupgradeneeded=()=>r.result.createObjectStore("s");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(v){try{const d=await idb();d.transaction("s","readwrite").objectStore("s").put(v,"imgs")}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction("s").objectStore("s").get("imgs");q.onsuccess=()=>res(q.result||{});q.onerror=()=>res({})})}catch(e){return {}}}
let mode="cards",grp=-1,only=false,i=0,rev=false,order=[];
const $=id=>document.getElementById(id);
const img=p=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent(p.name.replace(/\(|\)/g,"")+" rostlina");
const pool=()=>P.filter(p=>(grp<0||p.g===grp)&&(!only||mode==="list"||!K[p.n]));
function build(){order=pool();if(mode!=="list")order=order.slice().sort(()=>Math.random()-.5);i=0;rev=false;render()}
function mark(v){const p=order[i];K[p.n]=v;save();i++;rev=false;render()}
function openRp(){const p=order[i];if(!p)return;const d=document.createElement("div");d.id="rp";
 d.innerHTML=`<div><b>Nahlásit chybu</b><p class="sub">Např. špatný obrázek nebo překlep. Zprávu uvidí jen autor stránky.</p><textarea id="rpt" maxlength="800" placeholder="Co je špatně?"></textarea><div class="row" style="margin-top:8px"><button data-rc="1">Zrušit</button><button class="on" data-rs="${p.n}">Odeslat</button></div><div class="sub" id="rps"></div></div>`;document.body.appendChild(d)}
async function sendRp(n){const t=$("rpt").value.trim();if(!t)return;const p=P[n-1];if(!FORM.url){$("rps").textContent="Odesílání zatím není nastavené (autor musí vyplnit FORM v index.html).";return}$("rps").textContent="Odesílám…";
 try{const b={subject:`Poznávačka: č. ${n} ${p.name}`,cislo:n,rostlina:p.name,zprava:t,stranka:location.href};if(FORM.key)b.access_key=FORM.key;
  const r=await fetch(FORM.url,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(b)});
  if(!r.ok)throw 0;$("rps").textContent="Odesláno, díky! ✓";setTimeout(()=>{const m=$("rp");if(m)m.remove()},1200)}catch(e){$("rps").textContent="Odeslání se nepovedlo."}}
let TR=[],CV={},ti=-1,shuf=false,rep=0,seeking=false;
const au=$("au"),AX=/\.(mp3|m4a|ogg|oga|opus|wav|flac|aac|weba)$/i,JX=/\.jpe?g$/i,nice=f=>f.replace(AX,"").replace(/_/g," "),bs=f=>f.replace(/\.[^.]+$/,"").toLowerCase();
const cov=k=>{const f=CV[bs(TR[k])];return f?"hudba/"+encodeURIComponent(f):""};
const fmt=t=>isFinite(t)&&t>0?Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"):"0:00";
const ph=(c,cls)=>c?`<img class="${cls}" src="${c}" alt="">`:`<div class="${cls} ph">♪</div>`;
function ico(){const p=!au.paused;$("mbb").textContent=p?"⏸":"▶";$("bpp").textContent=p?"⏸":"▶"}
function prog(){const d=au.duration,t=au.currentTime,f=d?t/d:0;$("mbp").style.width=f*100+"%";if(!seeking){$("sk").value=f*1000;$("t1").textContent=fmt(t)}$("t2").textContent=fmt(d)}
function drawTr(){$("tl").innerHTML=TR.length?TR.map((f,k)=>`<li><button class="${k===ti?"cur":""}" data-tr="${k}">${ph(cov(k),"th")}<span>${k===ti&&!au.paused?"▶ ":""}${nice(f)}</span></button></li>`).join(""):'<li class="sub">Zatím žádné písničky (složka hudba/).</li>'}
function setUI(){const has=ti>=0,n=has?nice(TR[ti]):"Hudba",c=has?cov(ti):"";
 $("mbn").textContent=n;$("mbs").textContent=has?"":"Vyber písničku";$("shn").textContent=n;
 $("mbc").innerHTML=ph(c,"mbcv");$("shc").innerHTML=ph(c,"shcv");const bg=$("shbg");if(c){bg.src=c;bg.style.display="block"}else bg.style.display="none";
 $("bsh").classList.toggle("act",shuf);$("brp").textContent=rep===2?"🔂":"🔁";$("brp").classList.toggle("act",rep>0);
 $("mb").style.display=TR.length?"block":"none";ico();prog();drawTr()}
function playTr(k){if(!TR.length)return;ti=(k+TR.length)%TR.length;au.src="hudba/"+encodeURIComponent(TR[ti]);au.play().catch(()=>{});
 try{if("mediaSession" in navigator){const c=cov(ti);navigator.mediaSession.metadata=new MediaMetadata({title:nice(TR[ti]),artwork:c?[{src:new URL(c,location.href).href,sizes:"512x512",type:"image/jpeg"}]:[]});navigator.mediaSession.setActionHandler("nexttrack",nextTr);navigator.mediaSession.setActionHandler("previoustrack",()=>playTr(ti-1))}}catch(e){}
 setUI()}
function nextTr(){if(!TR.length)return;if(shuf&&TR.length>1){let k;do{k=Math.floor(Math.random()*TR.length)}while(k===ti);playTr(k)}else playTr(ti+1)}
function endedTr(){if(rep===2){au.currentTime=0;au.play()}else if(!shuf&&rep===0&&ti===TR.length-1){setUI()}else nextTr()}
function pa(a){
 if(a==="toggle"){if(ti<0)playTr(shuf?Math.floor(Math.random()*TR.length):0);else if(au.paused)au.play();else au.pause()}
 else if(a==="next")nextTr();
 else if(a==="prev"){if(ti>=0&&au.currentTime>3)au.currentTime=0;else playTr(ti<0?0:ti-1)}
 else if(a==="shuf"){shuf=!shuf;setUI()}else if(a==="rep"){rep=(rep+1)%3;setUI()}
 else if(a==="open"){$("sh").classList.add("open");document.body.style.overflow="hidden"}
 else if(a==="close"){$("sh").classList.remove("open");document.body.style.overflow=""}}
async function loadTracks(){try{const o=JSON.parse(localStorage.getItem("pzt2")||"{}");TR=o.t||[];CV=o.c||{}}catch(e){}setUI();
 try{const h=location.hostname.split(".")[0],r=location.pathname.split("/")[1];if(!location.hostname.endsWith("github.io")||!r)return;
  const j=await(await fetch(`https://api.github.com/repos/${h}/${r}/contents/hudba`)).json();if(!Array.isArray(j))return;
  const nm=j.map(x=>x.name);TR=nm.filter(n=>AX.test(n)).sort((a,b)=>a.localeCompare(b,"cs",{numeric:true}));
  CV={};nm.filter(n=>JX.test(n)).forEach(n=>CV[bs(n)]=n);
  try{localStorage.setItem("pzt2",JSON.stringify({t:TR,c:CV}))}catch(e){}if(ti>=0&&ti<TR.length){}else ti=-1;setUI()}catch(e){}}
au.addEventListener("play",()=>{ico();drawTr()});au.addEventListener("pause",()=>{ico();drawTr()});au.addEventListener("timeupdate",prog);au.addEventListener("loadedmetadata",prog);au.addEventListener("ended",endedTr);
$("sk").addEventListener("input",()=>{seeking=true;$("t1").textContent=fmt($("sk").value/1000*au.duration)});
$("sk").addEventListener("change",()=>{if(au.duration)au.currentTime=$("sk").value/1000*au.duration;seeking=false});
$("mb").addEventListener("click",e=>{if(!e.target.closest("button"))pa("open")});
function render(){
 $("modes").innerHTML=[["cards","Procvičování"],["list","Seznam"]].map(([m,t])=>`<button class="${mode===m?"on":""}" data-m="${m}">${t}</button>`).join("")+`<button class="${only?"on":""}" data-o="1">Jen co neumím</button><button data-x="1">↺ Reset</button>`;
 $("groups").innerHTML=[["-1","Vše"],...G.map((g,x)=>[x,g[0]])].map(([v,t])=>`<button class="${grp==v?"on":""}" data-g="${v}">${t}</button>`).join("");
 const kn=P.filter(p=>K[p.n]===true).length,dn=P.filter(p=>K[p.n]===false).length;
 $("stat").textContent=`umím ${kn} · neumím ${dn} · zbývá ${P.length-kn-dn}`;$("pb").style.width=kn/P.length*100+"%";
 ["cards","test","list"].forEach(m=>$("v-"+m).classList.toggle("hide",m!==(mode==="list"?"list":"cards")));
 const link=p=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent(p.name.replace(/\(|\)/g,"")+" rostlina");
 if(mode==="list"){
  const row=p=>`<li><span class="n">${p.n}</span><span class="t">${p.name}</span><a href="${link(p)}" target="_blank" rel="noopener">obrázky ↗</a><button class="ok ${K[p.n]===true?"on":""}" data-p="${p.n}" data-v="1">✓</button><button class="no ${K[p.n]===false?"on":""}" data-p="${p.n}" data-v="0">✗</button></li>`;
  const sec=(t,c,f)=>{const a=order.filter(f);return `<h2 class="${c}">${t} (${a.length})</h2>`+(a.length?"<ul>"+a.map(row).join("")+"</ul>":'<div class="sub">nic</div>')};
  $("v-list").innerHTML=sec("Neumím","no",p=>K[p.n]===false)+sec("Umím","ok",p=>K[p.n]===true)+sec("Neoznačeno","",p=>K[p.n]===undefined);return}
 const el=$("v-cards");
 if(i>=order.length){el.innerHTML=`<div class="card"><div class="name">${order.length?"Hotovo 🎉":"Nic k procvičení"}</div><button data-r="1">Znovu</button></div>`;return}
 const p=order[i];
 el.innerHTML=`<div class="card" id="cd"><button class="flag" data-rp="1" title="Nahlásit chybu" aria-label="Nahlásit chybu">⚑</button><div class="num">č. ${p.n} · ${i+1}/${order.length}</div><img src="obrazky/${FILES[p.n]?encodeURIComponent(FILES[p.n]):String(p.n).padStart(3,"0")+".jpg"}" data-n="${p.n}" data-i="0" onerror="nx(this)" draggable="false" alt=""><div class="name">${rev?p.name:"?"}</div><div class="grp">${G[p.g][0]}${rev?"":" · klikni na obrázek pro název"}</div>
 <div class="row" style="justify-content:center;margin-top:10px"><a class="btn" href="${link(p)}" target="_blank" rel="noopener">🔍 Další obrázky</a></div></div>
 <div class="row"><button class="no" data-k="0" style="flex:1">← Neumím</button><button class="ok" data-k="1" style="flex:1">Umím →</button></div>`;
}
document.addEventListener("click",e=>{const d=e.target.closest("button");if(!d)return;
 if(d.dataset.m){mode=d.dataset.m;build()}else if(d.dataset.g){grp=+d.dataset.g;build()}else if(d.dataset.o){only=!only;build()}
 else if(d.dataset.x){if(confirm("Smazat všechno označení Umím / Neumím?")){K={};save();build()}}
 else if(d.dataset.p){K[+d.dataset.p]=d.dataset.v==="1";save();render()}
 else if(d.dataset.tr!==undefined){playTr(+d.dataset.tr)}else if(d.dataset.pa){pa(d.dataset.pa)} else if(d.dataset.rp){openRp()}else if(d.dataset.rc){const m=$("rp");if(m)m.remove()}else if(d.dataset.rs){sendRp(+d.dataset.rs)}
 else if(d.dataset.k){mark(d.dataset.k==="1")}else if(d.dataset.r)build()});
let sx=0,dx=0,drag=false;
document.addEventListener("pointerdown",e=>{const c=e.target.closest("#cd");if(!c||e.target.closest("a,button"))return;drag=true;sx=e.clientX;dx=0;c.style.transition="none";try{c.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener("pointermove",e=>{if(!drag)return;const c=$("cd");if(!c)return;dx=e.clientX-sx;c.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`;c.style.borderColor=dx>40?"var(--ok)":dx<-40?"var(--no)":""});
function endDrag(){if(!drag)return;drag=false;const c=$("cd");if(!c)return;c.style.transition="";
 if(Math.abs(dx)>90){c.style.transform=`translateX(${dx>0?700:-700}px) rotate(${dx/10}deg)`;const v=dx>0;setTimeout(()=>mark(v),150)}
 else if(Math.abs(dx)<8){rev=!rev;render()}else{c.style.transform="";c.style.borderColor=""}}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",()=>{drag=false;const c=$("cd");if(c){c.style.transition="";c.style.transform="";c.style.borderColor=""}});
build();loadFiles();loadTracks();
</script></body></html>
